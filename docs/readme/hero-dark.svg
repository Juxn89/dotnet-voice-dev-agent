<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">dotnet-voice-dev-agent</title>
<desc id="desc">A .NET dev agent you talk to: it answers in a sentence or two, puts the details on screen, and remembers your repository between sessions. Its tools are read-only.</desc>
<style>
	.flow { stroke-dasharray: 6 7; animation: flow 1.6s linear infinite; }
	.pop { opacity: 0; animation: pop .5s ease-out forwards; }
	.glow { animation: glow 2.4s ease-in-out infinite alternate; }
	@keyframes flow { to { stroke-dashoffset: -26; } }
	@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
	@keyframes glow { from { opacity: .6; } to { opacity: 1; } }
	@media (prefers-reduced-motion: reduce) { .flow, .glow { animation: none; } .pop { animation: none; opacity: 1; } }
</style>
<defs>
	<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset=".55" stop-color="#be123c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
	<linearGradient id="metric" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
	<radialGradient id="orbRose"><stop offset="0" stop-color="#be123c" stop-opacity="0.3"/><stop offset="1" stop-color="#be123c" stop-opacity="0"/></radialGradient>
	<radialGradient id="orbAmber"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
	<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.06"/></pattern>
	<clipPath id="frame"><rect width="1280" height="460" rx="28"/></clipPath>
	<filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<g clip-path="url(#frame)">
	<rect width="1280" height="460" fill="#0d0a0c"/>
	<rect width="1280" height="460" fill="url(#dots)"/>
	<circle cx="180" cy="40" r="340" fill="url(#orbRose)"/>
	<circle cx="1080" cy="480" r="360" fill="url(#orbAmber)"/>
</g>
<rect x=".5" y=".5" width="1279" height="459" rx="28" fill="none" stroke="#33252b"/>

<g transform="translate(72 70)">
	<rect width="252" height="30" rx="15" fill="#171114" stroke="#33252b"/>
	<circle cx="18" cy="15" r="4.5" fill="#fb7185" class="glow"/>
	<text x="31" y="20" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing=".1em" fill="#a8999f">OPEN SOURCE · .NET 10 · MIT</text>
</g>
<text x="68" y="168" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-.03em" fill="#f8f1f3">dotnet-<tspan fill="url(#brand)">voice-dev-agent</tspan></text>
<text x="72" y="226" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f8f1f3">A .NET dev agent you talk to.</text>
<text x="72" y="264" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#a8999f">Answers in a sentence, puts the details on screen,</text>
<text x="72" y="296" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#a8999f">remembers your repo. Never edits a line of code.</text>
<g transform="translate(72 352)"><rect width="128.39999999999998" height="32" rx="16" fill="#171114" stroke="#33252b"/><text x="64.19999999999999" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f8f1f3">Push-to-talk</text></g><g transform="translate(208.39999999999998 352)"><rect width="202.2" height="32" rx="16" fill="#171114" stroke="#33252b"/><text x="101.1" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f8f1f3">Local Whisper &amp; Piper</text></g><g transform="translate(418.59999999999997 352)"><rect width="161.2" height="32" rx="16" fill="#171114" stroke="#33252b"/><text x="80.6" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f8f1f3">Claude Haiku 5.5</text></g><g transform="translate(587.8 352)"><rect width="153" height="32" rx="16" fill="#171114" stroke="#33252b"/><text x="76.5" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f8f1f3">Memory per repo</text></g><g transform="translate(748.8 352)"><rect width="153" height="32" rx="16" fill="#171114" stroke="#33252b"/><text x="76.5" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f8f1f3">Read-only tools</text></g>

<!-- What it heard -->
<g transform="translate(792 62)" filter="url(#soft)">
	
		<rect width="196" height="104" rx="16" fill="#1d1519" stroke="#33252b"/>
		<rect x="14" y="14" width="24" height="24" rx="7" fill="#be123c"/>
		<g transform="translate(18 18) scale(.6667)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></g>
		<text x="48" y="31" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f8f1f3">heard</text>
	<text font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="12" fill="#fda4af"><tspan x="16" y="68">"why is the build</tspan><tspan x="16" y="86">red?"</tspan></text>
</g>

<!-- What it remembered from last time -->
<g transform="translate(792 202)" filter="url(#soft)">
	
		<rect width="196" height="120" rx="16" fill="#1d1519" stroke="#33252b"/>
		<rect x="14" y="14" width="24" height="24" rx="7" fill="#be123c"/>
		<g transform="translate(18 18) scale(.6667)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M16 2v20"/></g>
		<text x="48" y="31" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f8f1f3">memory</text>
	<text font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#a8999f"><tspan x="16" y="66">Core is the project</tspan><tspan x="16" y="84">that matters. Finish the</tspan><tspan x="16" y="102">rename on Monday.</tspan></text>
</g>
<path d="M890 202 L 890 166" fill="none" stroke="#fb7185" stroke-width="2.2" class="flow"/>

<!-- One sentence to the ear -->
<g transform="translate(1034 54)" filter="url(#soft)"><g class="pop" style="animation-delay:.3s">
	
		<rect width="202" height="120" rx="16" fill="#1d1519" stroke="#33252b"/>
		<rect x="14" y="14" width="24" height="24" rx="7" fill="#be123c"/>
		<g transform="translate(18 18) scale(.6667)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></g>
		<text x="48" y="31" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f8f1f3">says</text>
	<text font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#f8f1f3"><tspan x="16" y="66">"Build's red, one error,</tspan><tspan x="16" y="84">left from your rename.</tspan><tspan x="16" y="102">Details on screen."</tspan></text>
</g></g>

<!-- The rest to the screen -->
<g transform="translate(1034 196)" filter="url(#soft)"><g class="pop" style="animation-delay:.9s">
	
		<rect width="202" height="126" rx="16" fill="#1d1519" stroke="#33252b"/>
		<rect x="14" y="14" width="24" height="24" rx="7" fill="#be123c"/>
		<g transform="translate(18 18) scale(.6667)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g>
		<text x="48" y="31" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f8f1f3">screen</text>
	<text font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="11" fill="#fda4af"><tspan x="16" y="66">ReviewOrchestrator.cs</tspan><tspan x="16" y="84">(111,54): CS1061</tspan><tspan x="16" y="102" fill="#a8999f">no member 'Patch'</tspan></text>
</g></g>

<path d="M988 108 C 1012 108, 1010 108, 1034 108" fill="none" stroke="#fb7185" stroke-width="2.2" class="flow"/>
<path d="M988 130 C 1014 130, 1008 252, 1034 252" fill="none" stroke="#fb7185" stroke-width="2.2" class="flow"/>
<circle cx="988" cy="108" r="4.5" fill="#fb7185"/>
<circle cx="988" cy="130" r="4.5" fill="#fb7185"/>
</svg>
